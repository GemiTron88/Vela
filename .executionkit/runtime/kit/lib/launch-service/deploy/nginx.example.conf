# Place behind an operator-selected host/certificate. Do not overwrite existing FLOW vhost.
server {
    listen 443 ssl;
    server_name REPLACE_WITH_RELEASE_HOST;
    ssl_certificate /etc/ssl/REPLACE_WITH_CERTIFICATE;
    ssl_certificate_key /etc/ssl/REPLACE_WITH_PRIVATE_KEY;
    client_max_body_size 512m;
    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        proxy_read_timeout 180s;
    }
}
